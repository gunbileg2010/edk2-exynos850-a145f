SOC_PLATFORM="EXYNOS850"
VENDOR_NAME="Samsung"
PLATFORM_NAME="a145f"

# Galaxy A14 4G (SM-A145F): Android 15, boot header v4, kernel-only boot.img.
BOOTIMG_OS_PATCH_LEVEL="2025-01"
BOOTIMG_OS_VERSION=15.0.0
BOOTIMG_HEADER_VERSION=4

# 0x90000000 is the bootloader's ect_binary reserved region (and 0x91200000 is
# sec_debug_next), so UEFI cannot live there on this device. uniLoader runs from
# 0xa0000000, so UEFI goes just above it.
FD_BASE=0xa1000000
FD_SIZE=0x00700000
